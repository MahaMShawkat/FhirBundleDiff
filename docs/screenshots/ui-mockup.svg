<svg viewBox="0 0 700 560" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>FHIR Bundle Diff Explainer UI mockup</title>
<desc>Upload two bundles, view change counts, and see AI explanations tagged high impact, context dependent, or benign.</desc>
<style>
  .bg{fill:#FFFFFF}
  .card{fill:#F7F6F2;stroke:#E3E1D8;stroke-width:1}
  .panel{fill:#FFFFFF;stroke:#E3E1D8;stroke-width:1}
  .dash{fill:none;stroke:#B4B2A9;stroke-width:1;stroke-dasharray:4 3}
  .btn{fill:#2C2C2A}
  .t{font-family:Arial,sans-serif;fill:#2C2C2A}
  .ts{font-family:Arial,sans-serif;fill:#5F5E5A}
  .tw{font-family:Arial,sans-serif;fill:#FFFFFF}
</style>
<rect class="bg" x="0" y="0" width="700" height="560"/>

<rect class="card" x="20" y="20" width="660" height="110" rx="12"/>
<rect class="dash" x="40" y="40" width="290" height="60" rx="8"/>
<text class="ts" x="185" y="75" font-size="13" text-anchor="middle">old-bundle.json</text>
<rect class="dash" x="350" y="40" width="290" height="60" rx="8"/>
<text class="ts" x="495" y="75" font-size="13" text-anchor="middle">new-bundle.json</text>
<rect class="btn" x="40" y="112" width="600" height="14" rx="6" opacity="0"/>
<rect class="btn" x="270" y="106" width="160" height="20" rx="6"/>
<text class="tw" x="350" y="120" font-size="11" text-anchor="middle">compare bundles</text>

<g>
<rect class="card" x="20" y="150" width="150" height="70" rx="10"/>
<text class="ts" x="35" y="172" font-size="11">added</text>
<text class="t" x="35" y="200" font-size="22" font-weight="bold">3</text>

<rect class="card" x="185" y="150" width="150" height="70" rx="10"/>
<text class="ts" x="200" y="172" font-size="11">removed</text>
<text class="t" x="200" y="200" font-size="22" font-weight="bold">1</text>

<rect class="card" x="350" y="150" width="150" height="70" rx="10"/>
<text class="ts" x="365" y="172" font-size="11">matched</text>
<text class="t" x="365" y="200" font-size="22" font-weight="bold">12</text>

<rect class="card" x="515" y="150" width="165" height="70" rx="10"/>
<text class="ts" x="530" y="172" font-size="11">no id</text>
<text class="t" x="530" y="200" font-size="22" font-weight="bold">2</text>
</g>

<g>
<rect class="panel" x="20" y="240" width="660" height="90" rx="10"/>
<text class="t" x="40" y="266" font-size="13" font-weight="bold">patient / patient-1</text>
<rect x="560" y="252" width="100" height="20" rx="5" fill="#F7C1C1"/>
<text x="610" y="266" font-size="10" text-anchor="middle" fill="#791F1F">high impact</text>
<text class="ts" x="40" y="290" font-size="12">gender changed female to male.</text>
<text class="ts" x="40" y="308" font-size="12">downstream systems keyed on demographics should reprocess this record.</text>
</g>

<g>
<rect class="panel" x="20" y="340" width="660" height="90" rx="10"/>
<text class="t" x="40" y="366" font-size="13" font-weight="bold">patient / patient-2</text>
<rect x="530" y="352" width="130" height="20" rx="5" fill="#FAC775"/>
<text x="595" y="366" font-size="10" text-anchor="middle" fill="#633806">context dependent</text>
<text class="ts" x="40" y="390" font-size="12">marital status updated.</text>
<text class="ts" x="40" y="408" font-size="12">review if downstream logic branches on this field.</text>
</g>

<g>
<rect class="panel" x="20" y="440" width="660" height="90" rx="10"/>
<text class="t" x="40" y="466" font-size="13" font-weight="bold">observation / obs-4</text>
<rect x="590" y="452" width="70" height="20" rx="5" fill="#C0DD97"/>
<text x="625" y="466" font-size="10" text-anchor="middle" fill="#27500A">benign</text>
<text class="ts" x="40" y="490" font-size="12">telecom value updated.</text>
<text class="ts" x="40" y="508" font-size="12">unlikely to affect clinical or downstream logic.</text>
</g>
</svg>
